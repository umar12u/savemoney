<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savings Goal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:#070b12;
  color:#eef6ff;
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:28px 18px 50px;
}

.brand{
  font-size:28px;
  font-weight:800;
  margin-bottom:22px;
}

.brand span{
  color:#70cfff;
}

/* AUTH */

.auth-card{
  max-width:450px;
  margin:70px auto;
  background:#0e1622;
  border:1px solid #1d3044;
  border-radius:22px;
  padding:26px;
  box-shadow:0 15px 45px #0005;
}

.auth-card h1{
  margin:0 0 8px;
}

.auth-sub{
  color:#91a5b8;
  margin-bottom:22px;
}

.auth-input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #29435b;
  background:#09111b;
  color:white;
  outline:none;
  margin-bottom:12px;
}

.auth-input:focus{
  border-color:#70cfff;
}

.primary{
  background:#70cfff;
  color:#06101a;
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:800;
  width:100%;
}

.google{
  background:white;
  color:#111;
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:700;
  width:100%;
  margin-top:10px;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:#607589;
  margin:18px 0;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:#263849;
  flex:1;
}

.auth-switch{
  text-align:center;
  margin-top:18px;
  color:#91a5b8;
}

.link{
  color:#70cfff;
  cursor:pointer;
  font-weight:700;
}

/* DASHBOARD */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:24px;
}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-email{
  color:#91a5b8;
  font-size:13px;
}

.logout{
  border:0;
  border-radius:10px;
  background:#182533;
  color:#c7d4e0;
  padding:10px 14px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-bottom:25px;
}

.summary-card{
  background:#0e1622;
  border:1px solid #1d3044;
  border-radius:18px;
  padding:20px;
}

.summary-label{
  color:#91a5b8;
  font-size:14px;
}

.summary-value{
  font-size:27px;
  font-weight:800;
  margin-top:7px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.section-title h2{
  margin:0;
}

.new-goal{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  background:#70cfff;
  color:#06101a;
  font-weight:800;
}

/* GOALS */

.goals{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.goal-card{
  background:#0e1622;
  border:1px solid #1d3044;
  border-radius:20px;
  overflow:hidden;
  transition:.2s;
}

.goal-card:hover{
  transform:translateY(-2px);
  border-color:#31516c;
}

.goal-image{
  height:190px;
  background:#09111b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6e8295;
  overflow:hidden;
}

.goal-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.goal-content{
  padding:18px;
}

.goal-name{
  font-size:21px;
  font-weight:800;
  margin-bottom:5px;
}

.goal-target{
  color:#91a5b8;
  font-size:14px;
}

.saved{
  font-size:24px;
  font-weight:800;
  margin-top:17px;
}

.bar{
  height:11px;
  background:#1a2835;
  border-radius:99px;
  overflow:hidden;
  margin:15px 0 8px;
}

.fill{
  height:100%;
  background:#45dc7c;
  border-radius:99px;
}

.percent{
  color:#45dc7c;
  font-weight:800;
  font-size:14px;
}

.goal-actions{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.open-btn{
  flex:1;
  border:0;
  border-radius:10px;
  padding:11px;
  background:#70cfff;
  color:#06101a;
  font-weight:800;
}

.delete-btn{
  border:0;
  border-radius:10px;
  padding:11px 13px;
  background:#261921;
  color:#ff8e9b;
  font-weight:800;
}

.empty{
  background:#0e1622;
  border:1px dashed #29435b;
  border-radius:18px;
  padding:45px 20px;
  text-align:center;
  color:#71869a;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:100;
}

.modal-box{
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow:auto;
  background:#0e1622;
  border:1px solid #1d3044;
  border-radius:22px;
  padding:24px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
}

.close{
  border:0;
  background:#182533;
  color:#c7d4e0;
  border-radius:10px;
  padding:8px 12px;
}

label{
  display:block;
  font-size:13px;
  color:#9db0c4;
  margin-bottom:7px;
}

.input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid #29435b;
  background:#09111b;
  color:white;
  outline:none;
  margin-bottom:15px;
}

.preview{
  height:200px;
  border:1px dashed #31516c;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#6e8295;
  background:#09111b;
  margin-bottom:15px;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.detail-image{
  height:280px;
  background:#09111b;
  border-radius:16px;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#71869a;
}

.detail-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.detail-saved{
  font-size:34px;
  font-weight:800;
  margin-top:20px;
}

.addbox{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.addbox input{
  flex:1;
  margin:0;
}

.add-btn{
  border:0;
  border-radius:12px;
  background:#70cfff;
  color:#06101a;
  font-weight:800;
  padding:12px 18px;
}

.history{
  margin-top:25px;
}

.history h3{
  margin-bottom:8px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #172535;
  color:#c7d4e0;
}

.row b{
  color:#45dc7c;
}

.hidden{
  display:none!important;
}

/* RESPONSIVE */

@media(max-width:850px){
  .goals{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .wrap{
    padding:20px 13px 40px;
  }

  .topbar{
    align-items:flex-start;
  }

  .user-area{
    flex-direction:column;
    align-items:flex-end;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .goals{
    grid-template-columns:1fr;
  }

  .goal-image{
    height:220px;
  }

  .addbox{
    flex-direction:column;
  }

  .add-btn{
    width:100%;
  }

  .detail-image{
    height:230px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    💰 <span>Savings</span> Goal
  </div>

  <!-- AUTH -->
  <div id="authCard" class="auth-card">

    <h1 id="authTitle">Welcome back</h1>
    <div class="auth-sub" id="authSub">
      Login to manage your savings goals.
    </div>

    <input
      id="email"
      class="auth-input"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      class="auth-input"
      type="password"
      placeholder="Password"
    >

    <button class="primary" onclick="handleEmailAuth()">
      <span id="emailButtonText">Login</span>
    </button>

    <div class="divider">or</div>

    <button class="google" onclick="googleLogin()">
      Continue with Google
    </button>

    <div class="auth-switch">
      <span id="switchText">Don't have an account?</span>
      <span class="link" onclick="toggleAuth()" id="switchButton">
        Sign up
      </span>
    </div>

  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <div class="topbar">

      <div>
        <h1 style="margin:0">My Goals</h1>
        <div class="user-email" id="userEmail"></div>
      </div>

      <div class="user-area">
        <button class="logout" onclick="logout()">
          Logout
        </button>
      </div>

    </div>

    <div class="summary">

      <div class="summary-card">
        <div class="summary-label">Total Saved</div>
        <div class="summary-value" id="totalSaved">
          0 so‘m
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Active Goals</div>
        <div class="summary-value" id="goalCount">
          0 / 10
        </div>
      </div>

    </div>

    <div class="section-title">

      <h2>My Goals</h2>

      <button class="new-goal" onclick="openCreateModal()">
        + New Goal
      </button>

    </div>

    <div id="goals" class="goals"></div>

  </div>

</div>


<!-- CREATE GOAL MODAL -->

<div id="createModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">
      <h2>Create New Goal</h2>
      <button class="close" onclick="closeCreateModal()">✕</button>
    </div>

    <label>Goal name</label>
    <input
      id="goalName"
      class="input"
      placeholder="Masalan: MacBook"
    >

    <label>Goal price ($)</label>
    <input
      id="goalUsd"
      class="input"
      type="number"
      min="1"
      placeholder="1000"
    >

    <label>Goal image</label>
    <input
      id="goalPhoto"
      class="input"
      type="file"
      accept="image/*"
      onchange="previewPhoto()"
    >

    <div id="photoPreview" class="preview">
      Rasm shu yerda ko‘rinadi
    </div>

    <button class="primary" onclick="createGoal()">
      Save Goal
    </button>

  </div>

</div>


<!-- DETAIL MODAL -->

<div id="detailModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="detailName"></h2>

      <button class="close" onclick="closeDetailModal()">
        ✕
      </button>
    </div>

    <div id="detailImage" class="detail-image">
      Rasm yo‘q
    </div>

    <div class="detail-saved" id="detailSaved">
      0 so‘m
    </div>

    <div class="goal-target">
      Target: <b id="detailTarget">0 so‘m</b>
    </div>

    <div class="bar">
      <div class="fill" id="detailFill"></div>
    </div>

    <div class="percent" id="detailPercent">
      0%
    </div>

    <div class="addbox">

      <input
        id="addAmount"
        class="input"
        type="number"
        min="1"
        placeholder="Masalan: 50 000"
      >

      <button class="add-btn" onclick="addMoney()">
        + Add
      </button>

    </div>

    <div class="history">

      <h3>Transaction History</h3>

      <div id="history"></div>

    </div>

    <button
      class="delete-btn"
      style="width:100%;margin-top:22px"
      onclick="deleteCurrentGoal()"
    >
      🗑️ Delete Goal
    </button>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://npskhoffyfcvniduzkbx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ljO4MsOZ8rubDSHIbIK30Q_uoCVtxmD";

const { createClient } =
supabase;

const supabaseClient =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   CONSTANTS
========================= */

const RATE = 12000;
const MAX_GOALS = 10;


/* =========================
   STATE
========================= */

let currentUser = null;
let goals = [];
let currentGoal = null;
let photoData = "";
let authMode = "login";


/* =========================
   HELPERS
========================= */

function money(n){

  return new Intl.NumberFormat("uz-UZ")
    .format(Math.round(Number(n) || 0))
    + " so‘m";

}

function usd(n){

  return "$" + Number(n || 0).toLocaleString();

}


/* =========================
   AUTH MODE
========================= */

function toggleAuth(){

  authMode =
    authMode === "login"
      ? "signup"
      : "login";

  document.getElementById("authTitle").textContent =
    authMode === "login"
      ? "Welcome back"
      : "Create account";

  document.getElementById("authSub").textContent =
    authMode === "login"
      ? "Login to manage your savings goals."
      : "Create your account to start saving.";

  document.getElementById("emailButtonText").textContent =
    authMode === "login"
      ? "Login"
      : "Sign up";

  document.getElementById("switchText").textContent =
    authMode === "login"
      ? "Don't have an account?"
      : "Already have an account?";

  document.getElementById("switchButton").textContent =
    authMode === "login"
      ? "Sign up"
      : "Login";

}


/* =========================
   EMAIL AUTH
========================= */

async function handleEmailAuth(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    alert("Email va passwordni kiriting.");

    return;
  }

  let result;

  if(authMode === "login"){

    result =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

  }else{

    result =
      await supabaseClient.auth.signUp({
        email,
        password
      });

  }

  if(result.error){

    alert(result.error.message);

    return;
  }

  if(authMode === "signup" && !result.data.session){

    alert(
      "Account yaratildi. Emailingizni tasdiqlang."
    );

    return;
  }

}


/* =========================
   GOOGLE
========================= */

async function googleLogin(){

  const { error } =
    await supabaseClient.auth.signInWithOAuth({

      provider:"google",

      options:{
        redirectTo:
          window.location.origin
      }

    });

  if(error){

    alert(error.message);

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  goals = [];

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("authCard")
    .classList.remove("hidden");

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if(session && session.user){

      currentUser =
        session.user;

      await openApp();

    }else{

      currentUser = null;

    }

  }
);


/* =========================
   OPEN APP
========================= */

async function openApp(){

  document.getElementById("authCard")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  document.getElementById("userEmail")
    .textContent =
    currentUser.email || "";

  await loadGoals();

}


/* =========================
   LOAD GOALS
========================= */

async function loadGoals(){

  const { data, error } =
    await supabaseClient
      .from("goals")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending:false
      });

  if(error){

    alert(error.message);

    return;

  }

  goals = data || [];

  renderGoals();

}


/* =========================
   RENDER GOALS
========================= */

function renderGoals(){

  const container =
    document.getElementById("goals");

  document.getElementById("goalCount")
    .textContent =
    `${goals.length} / ${MAX_GOALS}`;

  const total =
    goals.reduce(
      (sum, goal) =>
        sum + Number(goal.saved_amount || 0),
      0
    );

  document.getElementById("totalSaved")
    .textContent =
    money(total);


  if(!goals.length){

    container.innerHTML = `
      <div class="empty">
        <div style="font-size:45px">🎯</div>
        <h3>No goals yet</h3>
        <p>Create your first savings goal.</p>
      </div>
    `;

    return;

  }


  container.innerHTML =
    goals.map(goal => {

      const target =
        Number(goal.target_amount || 0);

      const saved =
        Number(goal.saved_amount || 0);

      const percent =
        target > 0
          ? Math.min(100, saved / target * 100)
          : 0;


      return `

        <div class="goal-card">

          <div class="goal-image">

            ${
              goal.image_url
              ? `<img src="${goal.image_url}">`
              : "No image"
            }

          </div>

          <div class="goal-content">

            <div class="goal-name">
              ${escapeHtml(goal.name)}
            </div>

            <div class="goal-target">
              Target: ${money(target)}
            </div>

            <div class="saved">
              ${money(saved)}
            </div>

            <div class="bar">
              <div
                class="fill"
                style="width:${percent}%"
              ></div>
            </div>

            <div class="percent">
              ${formatPercent(percent)}%
            </div>

            <div class="goal-actions">

              <button
                class="open-btn"
                onclick="openGoal('${goal.id}')"
              >
                Open
              </button>

              <button
                class="delete-btn"
                onclick="deleteGoal('${goal.id}')"
              >
                🗑️
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   CREATE MODAL
========================= */

function openCreateModal(){

  if(goals.length >= MAX_GOALS){

    alert(
      `You can have up to ${MAX_GOALS} active goals.`
    );

    return;

  }

  document.getElementById("createModal")
    .classList.remove("hidden");

}


function closeCreateModal(){

  document.getElementById("createModal")
    .classList.add("hidden");

  document.getElementById("goalName").value = "";
  document.getElementById("goalUsd").value = "";
  document.getElementById("goalPhoto").value = "";

  photoData = "";

  document.getElementById("photoPreview")
    .innerHTML =
    "Rasm shu yerda ko‘rinadi";

}


/* =========================
   IMAGE PREVIEW
========================= */

function previewPhoto(){

  const file =
    document.getElementById("goalPhoto")
      .files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = () => {

    photoData =
      reader.result;

    document.getElementById("photoPreview")
      .innerHTML =
      `<img src="${photoData}">`;

  };

  reader.readAsDataURL(file);

}


/* =========================
   CREATE GOAL
========================= */

async function createGoal(){

  if(!currentUser){

    alert("Please login first.");

    return;

  }

  if(goals.length >= MAX_GOALS){

    alert(
      `You can have up to ${MAX_GOALS} active goals.`
    );

    return;

  }


  const name =
    document.getElementById("goalName")
      .value.trim();

  const usdAmount =
    Number(
      document.getElementById("goalUsd").value
    );

  const file =
    document.getElementById("goalPhoto")
      .files[0];


  if(!name || !usdAmount || usdAmount <= 0){

    alert(
      "Goal nomi va narxini kiriting."
    );

    return;

  }


  let imageUrl = null;


  /* UPLOAD IMAGE */

  if(file){

    const extension =
      file.name.split(".").pop();

    const path =
      `${currentUser.id}/${crypto.randomUUID()}.${extension}`;


    const upload =
      await supabaseClient
        .storage
        .from("goal-images")
        .upload(
          path,
          file,
          {
            upsert:false,
            contentType:file.type
          }
        );


    if(upload.error){

      alert(upload.error.message);

      return;

    }


    const publicUrl =
      supabaseClient
        .storage
        .from("goal-images")
        .getPublicUrl(path);


    imageUrl =
      publicUrl.data.publicUrl;

  }


  const targetAmount =
    usdAmount * RATE;


  const { error } =
    await supabaseClient
      .from("goals")
      .insert({

        user_id:
          currentUser.id,

        name:
          name,

        target_amount:
          targetAmount,

        image_url:
          imageUrl,

        saved_amount:
          0

      });


  if(error){

    alert(error.message);

    return;

  }


  closeCreateModal();

  await loadGoals();

}


/* =========================
   OPEN GOAL
========================= */

async function openGoal(id){

  const goal =
    goals.find(
      x => x.id === id
    );

  if(!goal) return;

  currentGoal = goal;

  document.getElementById("detailModal")
    .classList.remove("hidden");

  await renderGoalDetail();

}


/* =========================
   DETAIL
========================= */

async function renderGoalDetail(){

  const goal =
    currentGoal;

  document.getElementById("detailName")
    .textContent =
    goal.name;

  document.getElementById("detailTarget")
    .textContent =
    money(goal.target_amount);

  document.getElementById("detailSaved")
    .textContent =
    money(goal.saved_amount);


  const target =
    Number(goal.target_amount);

  const saved =
    Number(goal.saved_amount);

  const percent =
    target > 0
      ? Math.min(100, saved / target * 100)
      : 0;


  document.getElementById("detailFill")
    .style.width =
    percent + "%";

  document.getElementById("detailPercent")
    .textContent =
    formatPercent(percent) + "%";


  document.getElementById("detailImage")
    .innerHTML =
    goal.image_url
      ? `<img src="${goal.image_url}">`
      : "No image";


  await loadHistory();

}


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){

  const { data, error } =
    await supabaseClient
      .from("transactions")
      .select("*")
      .eq("goal_id", currentGoal.id)
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending:false
      });


  if(error){

    alert(error.message);

    return;

  }


  const history =
    document.getElementById("history");


  if(!data || !data.length){

    history.innerHTML =
      `<div class="empty">
        Hali pul qo‘shilmagan.
      </div>`;

    return;

  }


  history.innerHTML =
    data.map(transaction => {

      const date =
        new Date(
          transaction.created_at
        ).toLocaleString("uz-UZ");


      return `

        <div class="row">

          <span>
            ${date}
          </span>

          <b>
            +${money(transaction.amount)}
          </b>

        </div>

      `;

    }).join("");

}


/* =========================
   ADD MONEY
========================= */

async function addMoney(){

  const amount =
    Number(
      document.getElementById("addAmount")
        .value
    );


  if(!amount || amount <= 0){

    alert(
      "To‘g‘ri summa kiriting."
    );

    return;

  }


  const { error: transactionError } =
    await supabaseClient
      .from("transactions")
      .insert({

        goal_id:
          currentGoal.id,

        user_id:
          currentUser.id,

        amount:
          amount

      });


  if(transactionError){

    alert(
      transactionError.message
    );

    return;

  }


  const newSaved =
    Number(currentGoal.saved_amount || 0)
    + amount;


  const { error: goalError } =
    await supabaseClient
      .from("goals")
      .update({

        saved_amount:
          newSaved

      })
      .eq("id", currentGoal.id)
      .eq("user_id", currentUser.id);


  if(goalError){

    alert(
      goalError.message
    );

    return;

  }


  currentGoal.saved_amount =
    newSaved;


  document.getElementById("addAmount")
    .value = "";


  await renderGoalDetail();
  await loadGoals();

}


/* =========================
   DELETE GOAL
========================= */

async function deleteGoal(id){

  const goal =
    goals.find(
      x => x.id === id
    );

  if(!goal) return;


  const confirmed =
    confirm(
      `“${goal.name}” goalini o‘chirmoqchimisiz?\n\n` +
      `Bu goal va uning transaction history'si o‘chiriladi.`
    );


  if(!confirmed) return;


  await performDelete(goal);

}


/* =========================
   DELETE CURRENT GOAL
========================= */

async function deleteCurrentGoal(){

  if(!currentGoal) return;


  const confirmed =
    confirm(
      `“${currentGoal.name}” goalini o‘chirmoqchimisiz?\n\n` +
      `Bu goal va barcha transaction history'si o‘chiriladi.`
    );


  if(!confirmed) return;


  await performDelete(currentGoal);

}


/* =========================
   PERFORM DELETE
========================= */

async function performDelete(goal){

  /*
    Delete database goal.
    Transactions should be deleted
    automatically because of
    ON DELETE CASCADE.
  */

  const { error } =
    await supabaseClient
      .from("goals")
      .delete()
      .eq("id", goal.id)
      .eq("user_id", currentUser.id);


  if(error){

    alert(
      "Goal o‘chirilmadi: "
      + error.message
    );

    return;

  }


  /*
    Delete image from Storage
    if image exists.
  */

  if(goal.image_url){

    try{

      const marker =
        "/goal-images/";

      const index =
        goal.image_url.indexOf(marker);

      if(index !== -1){

        const path =
          decodeURIComponent(
            goal.image_url
              .substring(
                index + marker.length
              )
              .split("?")[0]
          );


        await supabaseClient
          .storage
          .from("goal-images")
          .remove([path]);

      }

    }catch(e){

      console.log(
        "Image delete skipped:",
        e
      );

    }

  }


  currentGoal = null;


  closeDetailModal();


  await loadGoals();


  alert("Goal o‘chirildi.");

}


/* =========================
   CLOSE DETAIL
========================= */

function closeDetailModal(){

  document.getElementById("detailModal")
    .classList.add("hidden");

  currentGoal = null;

}


/* =========================
   FORMAT
========================= */

function formatPercent(n){

  const number =
    Number(n) || 0;

  return number % 1
    ? number.toFixed(1)
    : number.toFixed(0);

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   INITIAL SESSION
========================= */

(async function(){

  const { data } =
    await supabaseClient
      .auth
      .getSession();


  if(data.session){

    currentUser =
      data.session.user;

    await openApp();

  }

})();

</script>
